definitions:
  steps:
    - step: &backend_checks
        name: Backend checks (Laravel)
        image: php:8.2-cli
        caches:
          - composer
        script:
          - apt-get update && apt-get install -y unzip git libzip-dev gnupg2 curl apt-transport-https
          - docker-php-ext-install zip pcntl
          # Install SQL Server driver prerequisites
          - curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          - echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/debian/12/prod bookworm main" > /etc/apt/sources.list.d/mssql-release.list
          - apt-get update && ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
          - pecl install sqlsrv pdo_sqlsrv && docker-php-ext-enable sqlsrv pdo_sqlsrv
          - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          - cd backend-laravel
          - composer install --no-interaction --prefer-dist --optimize-autoloader
          - cp .env.example .env
          - php artisan key:generate
          - php artisan config:cache
          - php artisan route:cache
          - echo "Backend build OK"
        artifacts:
          - backend-laravel/vendor/**
          - backend-laravel/bootstrap/cache/**
          - backend-laravel/composer.json
          - backend-laravel/composer.lock
          - backend-laravel/artisan

    - step: &frontend_checks
        name: Frontend checks
        image: ghcr.io/cirruslabs/flutter:stable
        script:
          - cd app
          - flutter pub get
          - flutter analyze
          - flutter test
          - flutter build web --release --dart-define=BACKEND_BASE_URL=${APP_BACKEND_BASE_URL:-https://example.invalid} --dart-define=AUTH_ENABLED=true
          - test -f build/web/index.html
        artifacts:
          - app/build/web/**

    - step: &deploy_production
        name: Deploy production host
        deployment: production
        runs-on:
          - self.hosted
          - linux.shell
        script:
          - echo "==> Iniciando deploy..."
          - test -d backend-laravel/vendor
          - test -f app/build/web/index.html
          - |
            umask 077
            echo "$SSH_KEY_webrun01" | base64 --decode > ./id_rsa
            chmod 600 ./id_rsa
          - mkdir -p ~/.ssh
          - ssh-keyscan -T 5 172.18.0.86 >> ~/.ssh/known_hosts 2>/dev/null || true
          - 'test -s ./id_rsa || { echo "Decoded SSH key is empty. Check SSH_KEY_webrun01."; exit 1; }'
          - tar -czf app-dist.tar.gz -C app/build/web .
          - tar -czf backend-laravel.tar.gz -C backend-laravel .
          - export APP_ARCHIVE_REMOTE=/tmp/sonora-app-${BITBUCKET_BUILD_NUMBER}.tar.gz
          - export BACKEND_ARCHIVE_REMOTE=/tmp/sonora-backend-${BITBUCKET_BUILD_NUMBER}.tar.gz
          - scp -i ./id_rsa ./app-dist.tar.gz spotti@172.18.0.86:${APP_ARCHIVE_REMOTE}
          - scp -i ./id_rsa ./backend-laravel.tar.gz spotti@172.18.0.86:${BACKEND_ARCHIVE_REMOTE}
          - ssh -i ./id_rsa spotti@172.18.0.86 "APP_ROOT='${DEPLOY_APP_PATH:-/storage-apps/www/sonora}' REPO_URL='git@bitbucket.org:spotpromo/sonora.git' BRANCH='main' BACKEND_ARCHIVE='${BACKEND_ARCHIVE_REMOTE}' APP_ARCHIVE='${APP_ARCHIVE_REMOTE}' APP_DOMAIN='${DEPLOY_APP_DOMAIN:-}' RELOAD_NGINX='${DEPLOY_RELOAD_NGINX:-0}' bash -s" < scripts/deploy-linux-host.sh
          - echo "==> Deploy concluido!"

pipelines:
  default:
    - parallel:
        - step: *backend_checks
        - step: *frontend_checks

  branches:
    main:
      - parallel:
          - step: *backend_checks
          - step: *frontend_checks
      - step: *deploy_production
