pipelines:
  branches:
    main:
      - step:
          name: "Build Laravel Web Assets"
          image: node:20
          caches:
            - node
          script:
            - echo "==> Gerando build web do backend-laravel..."
            - cd backend-laravel
            - npm ci
            - npm run build
            - test -f public/build/manifest.json
            - ls -la public/build | sed 's/^/  /'
          artifacts:
            - backend-laravel/public/build/**

      - step:
          name: "Deploy Sonora"
          deployment: production
          runs-on:
            - 'self.hosted'
            - 'linux.shell'
          script:
            - echo "==> Iniciando deploy..."
            - |
              umask 077
              echo "$SSH_KEY_webrun01" | base64 --decode > ./id_rsa
              chmod 600 ./id_rsa
            - mkdir -p ~/.ssh
            - ssh-keyscan -T 5 172.18.0.86 >> ~/.ssh/known_hosts 2>/dev/null || true
            - 'test -s ./id_rsa || { echo "Decoded SSH key is empty. Check SSH_KEY_webrun01."; exit 1; }'
            - test -f backend-laravel/public/build/manifest.json
            - tar -czf backend-laravel-public-build-artifact.tar.gz -C backend-laravel/public build
            - scp -i ./id_rsa ./backend-laravel-public-build-artifact.tar.gz spotti@172.18.0.86:/tmp/sonora-backend-laravel-build-${BITBUCKET_BUILD_NUMBER}.tar.gz
            - |
              BUILD_ARCHIVE="/tmp/sonora-backend-laravel-build-${BITBUCKET_BUILD_NUMBER}.tar.gz"
              ssh -i ./id_rsa spotti@172.18.0.86 "APP_DOMAIN='${DEPLOY_APP_DOMAIN:-}' BUILD_ARCHIVE='$BUILD_ARCHIVE' bash -s" <<'BASH'
              set -Eeuo pipefail

              APP_PATH="${APP_PATH:-/storage-apps/www/sonora}"
              REPO="git@bitbucket.org:spotpromo/sonora.git"
              BRANCH="main"
              PHP_BIN="${PHP_BIN:-php}"
              COMPOSER_BIN="${COMPOSER_BIN:-composer}"
              ENV_BACKUP="/tmp/sonora-env.backup"
              POST_HOOK="/home/spotti/post-deploy.sh"
              PHP_FPM_SERVICE="${PHP_FPM_SERVICE:-php8.2-fpm}"
              BACKEND_DIR="$APP_PATH/backend-laravel"
              PUBLIC_PREFIX_DEFAULT="/backend-laravel/public"

              log(){ printf "[%s] %s\n" "$(date +%F' '%T)" "$*"; }
              assert_runtime_writable() {
                target="$1"
                probe="$target/.deploy-write-test-$$"
                mkdir -p "$target"
                : > "$probe"
                rm -f "$probe"
              }
              mark_safe_directory(){ git config --global --add safe.directory "$APP_PATH" >/dev/null 2>&1 || true; }
              ensure_origin_remote(){
                if git remote get-url origin >/dev/null 2>&1; then
                  git remote set-url origin "$REPO"
                else
                  git remote add origin "$REPO"
                fi
              }
              backup_env(){ [ -f "$BACKEND_DIR/.env" ] && cp "$BACKEND_DIR/.env" "$ENV_BACKUP" || true; }
              restore_env(){ [ ! -f "$BACKEND_DIR/.env" ] && [ -f "$ENV_BACKUP" ] && cp "$ENV_BACKUP" "$BACKEND_DIR/.env" || true; }
              purge_checkout_blockers(){ find "$APP_PATH" -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.env' -exec rm -rf {} +; }
              normalize_checkout_perms(){
                [ -d "$APP_PATH" ] || return 0
                find "$APP_PATH" -path "$APP_PATH/.git" -prune -o \( -type d -exec chmod u+rwx {} + \) -o \( -type f -exec chmod u+rw {} + \) 2>/dev/null || true
              }
              upsert_env(){
                key="$1"
                value="$2"
                [ -f "$BACKEND_DIR/.env" ] || return 0
                if grep -q "^${key}=" "$BACKEND_DIR/.env"; then
                  sed -i "s|^${key}=.*|${key}=${value}|" "$BACKEND_DIR/.env"
                else
                  printf "\n%s=%s\n" "$key" "$value" >> "$BACKEND_DIR/.env"
                fi
              }
              run_with_privilege(){
                if command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; then
                  sudo -n "$@"
                  return $?
                fi
                if [ "$(id -u)" -eq 0 ]; then
                  "$@"
                  return $?
                fi
                return 1
              }

              if [ -d "$APP_PATH" ] && [ ! -w "$APP_PATH" ]; then
                log "ERROR: $APP_PATH existe, mas nao esta gravavel para $(whoami)."
                log "Ajuste owner/permissoes do diretorio antes de rodar o deploy."
                exit 10
              fi

              APP_PARENT="$(dirname "$APP_PATH")"
              if [ ! -d "$APP_PATH" ] && [ ! -w "$APP_PARENT" ]; then
                log "ERROR: $APP_PARENT nao esta gravavel para $(whoami), entao $APP_PATH nao pode ser criado."
                exit 11
              fi

              if [ ! -d "$APP_PATH" ]; then
                log "App directory does not exist. Cloning into $APP_PATH..."
                mkdir -p "$APP_PATH" 2>/dev/null || true
                if git clone --branch "$BRANCH" --depth 1 "$REPO" "$APP_PATH" 2>/dev/null; then
                  log "Direct clone completed."
                else
                  log "Direct clone failed. Initializing repo in place..."
                  mkdir -p "$APP_PATH" || true
                  cd "$APP_PATH"
                  backup_env
                  git init
                  mark_safe_directory
                  ensure_origin_remote
                  purge_checkout_blockers
                  git fetch origin "$BRANCH" --depth=1
                  git checkout -B "$BRANCH" "origin/$BRANCH"
                  restore_env
                fi
              elif [ ! -d "$APP_PATH/.git" ]; then
                log "App directory exists without .git. Initializing repo in place..."
                cd "$APP_PATH"
                backup_env
                git init
                mark_safe_directory
                ensure_origin_remote
                purge_checkout_blockers
                git fetch origin "$BRANCH" --depth=1
                git checkout -B "$BRANCH" "origin/$BRANCH"
                restore_env
              else
                cd "$APP_PATH"
                mark_safe_directory
                ensure_origin_remote
                log "Syncing repository..."
                normalize_checkout_perms
                git fetch origin "$BRANCH" --prune
                git reset --hard >/dev/null 2>&1 || true
                git clean -fd
                git checkout -B "$BRANCH" "origin/$BRANCH"
                git reset --hard "origin/$BRANCH"
                git clean -fd
              fi

              cd "$APP_PATH"

              if [ ! -f "$BACKEND_DIR/.env" ] && [ -f "$BACKEND_DIR/.env.example" ]; then
                cp "$BACKEND_DIR/.env.example" "$BACKEND_DIR/.env"
                log "Arquivo .env criado a partir de .env.example."
              else
                log "Arquivo .env mantido no servidor."
              fi

              if [ -n "${APP_DOMAIN:-}" ]; then
                upsert_env "APP_URL" "https://${APP_DOMAIN}"
              fi
              upsert_env "APP_ENV" "production"
              upsert_env "APP_DEBUG" "false"
              upsert_env "PUBLIC_PREFIX" "$PUBLIC_PREFIX_DEFAULT"

              if ! "$COMPOSER_BIN" --version >/dev/null 2>&1; then
                for c in /usr/local/bin/composer /usr/bin/composer; do
                  [ -x "$c" ] && COMPOSER_BIN="$c" && break
                done
              fi

              if ! "$COMPOSER_BIN" --version >/dev/null 2>&1; then
                log "ERROR: composer nao encontrado."
                exit 20
              fi

              log "Running composer install..."
              cd "$BACKEND_DIR"
              "$COMPOSER_BIN" install --no-dev --prefer-dist --no-interaction --optimize-autoloader

              if [ ! -f "$BUILD_ARCHIVE" ]; then
                log "ERROR: artifact de frontend nao encontrado em $BUILD_ARCHIVE."
                exit 21
              fi

              log "Atualizando public/build..."
              rm -rf "$BACKEND_DIR/public/build"
              tar -xzf "$BUILD_ARCHIVE" -C "$BACKEND_DIR/public"
              rm -f "$BUILD_ARCHIVE"
              test -f "$BACKEND_DIR/public/build/manifest.json"

              mkdir -p "$BACKEND_DIR/bootstrap/cache"
              mkdir -p "$BACKEND_DIR/storage/logs"
              mkdir -p "$BACKEND_DIR/storage/framework/cache/data"
              mkdir -p "$BACKEND_DIR/storage/framework/sessions"
              mkdir -p "$BACKEND_DIR/storage/framework/views"
              mkdir -p "$BACKEND_DIR/storage/app/recordings"
              chmod -R a+rwX "$BACKEND_DIR/bootstrap/cache" "$BACKEND_DIR/storage" || true
              assert_runtime_writable "$BACKEND_DIR/bootstrap/cache"
              assert_runtime_writable "$BACKEND_DIR/storage/logs"
              assert_runtime_writable "$BACKEND_DIR/storage/framework/cache/data"
              assert_runtime_writable "$BACKEND_DIR/storage/framework/sessions"
              assert_runtime_writable "$BACKEND_DIR/storage/framework/views"
              assert_runtime_writable "$BACKEND_DIR/storage/app/recordings"

              "$PHP_BIN" artisan storage:link 2>/dev/null || true

              if [ -f "$BACKEND_DIR/.env" ] && grep -q '^APP_KEY=$' "$BACKEND_DIR/.env"; then
                log "Gerando APP_KEY..."
                "$PHP_BIN" artisan key:generate --force || true
              fi

              log "Entrando em maintenance mode..."
              "$PHP_BIN" artisan down || true

              log "Executando migrations..."
              "$PHP_BIN" artisan migrate --force || true

              log "Clearing caches..."
              "$PHP_BIN" artisan config:clear || true
              "$PHP_BIN" artisan route:clear || true
              "$PHP_BIN" artisan view:clear || true
              "$PHP_BIN" artisan cache:clear || true
              "$PHP_BIN" artisan package:discover --ansi || true

              log "Rebuilding production caches..."
              "$PHP_BIN" artisan config:cache || true
              "$PHP_BIN" artisan route:cache || true
              "$PHP_BIN" artisan view:cache || true

              "$PHP_BIN" artisan db:seed --class=ProfileSeeder --force --no-interaction 2>/dev/null || true

              log "Leaving maintenance mode..."
              "$PHP_BIN" artisan up || true

              if [ -x "$POST_HOOK" ]; then
                log "Running post-deploy hook..."
                "$POST_HOOK" "$APP_PATH" || true
              else
                log "Restarting PHP-FPM ($PHP_FPM_SERVICE)..."
                if run_with_privilege systemctl restart "$PHP_FPM_SERVICE"; then
                  log "PHP-FPM restarted."
                else
                  log "Warning: could not restart PHP-FPM automatically."
                fi
              fi

              PUBLIC_DOMAIN="${APP_DOMAIN:-sonora.spotpromo.com.br}"
              PUBLIC_BASE_URL="https://${PUBLIC_DOMAIN}"
              ROOT_HEADERS="/tmp/sonora-root-headers-$$.txt"

              log "Executando smoke checks em ${PUBLIC_BASE_URL}..."
              curl -sS -D "$ROOT_HEADERS" -o /dev/null "$PUBLIC_BASE_URL/"
              ROOT_STATUS="$(awk 'toupper($1) ~ /^HTTP/ { code=$2 } END { print code }' "$ROOT_HEADERS")"
              ROOT_LOCATION="$(awk 'BEGIN { IGNORECASE=1 } /^Location:/ { print $2 }' "$ROOT_HEADERS" | tr -d '\r' | tail -n 1)"
              rm -f "$ROOT_HEADERS"

              if [ "$ROOT_STATUS" != "301" ] && [ "$ROOT_STATUS" != "302" ]; then
                log "ERROR: / deveria redirecionar para /login, mas retornou status $ROOT_STATUS."
                exit 30
              fi

              case "$ROOT_LOCATION" in
                "/login"|"$PUBLIC_BASE_URL/login")
                  ;;
                *)
                  log "ERROR: / deveria redirecionar para /login, mas retornou Location='$ROOT_LOCATION'."
                  exit 31
                  ;;
              esac

              curl -fsS "$PUBLIC_BASE_URL/login" >/dev/null || {
                log "ERROR: smoke check falhou em $PUBLIC_BASE_URL/login."
                exit 32
              }

              curl -fsS "$PUBLIC_BASE_URL/api/health" >/dev/null || {
                log "ERROR: smoke check falhou em $PUBLIC_BASE_URL/api/health."
                exit 33
              }

              log "Deploy finished successfully."
              BASH
            - echo "==> Deploy concluido!"
